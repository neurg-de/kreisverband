<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="nightsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1A2E"/>
      <stop offset="50%" stop-color="#1A2F4A"/>
      <stop offset="100%" stop-color="#1E3A30"/>
    </linearGradient>
    <linearGradient id="darkhill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A3D2E"/>
      <stop offset="100%" stop-color="#0F2B1F"/>
    </linearGradient>
    <linearGradient id="darkhill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#162E23"/>
      <stop offset="100%" stop-color="#0A1F14"/>
    </linearGradient>
  </defs>
  <!-- Night sky -->
  <rect width="1600" height="900" fill="url(#nightsky)"/>
  <!-- Stars -->
  <g fill="white" opacity="0.7">
    <circle cx="100" cy="80" r="1.5"/><circle cx="250" cy="120" r="1"/>
    <circle cx="400" cy="60" r="1.5"/><circle cx="550" cy="150" r="1"/>
    <circle cx="700" cy="90" r="2"/><circle cx="850" cy="50" r="1"/>
    <circle cx="1000" cy="130" r="1.5"/><circle cx="1150" cy="70" r="1"/>
    <circle cx="1300" cy="110" r="1.5"/><circle cx="1450" cy="60" r="1"/>
    <circle cx="180" cy="200" r="1"/><circle cx="350" cy="180" r="1.5"/>
    <circle cx="620" cy="210" r="1"/><circle cx="780" cy="170" r="1"/>
    <circle cx="1050" cy="200" r="1.5"/><circle cx="1250" cy="180" r="1"/>
    <circle cx="1400" cy="220" r="1"/><circle cx="500" cy="250" r="1"/>
    <circle cx="900" cy="240" r="1.5"/><circle cx="1350" cy="260" r="1"/>
  </g>
  <!-- Moon -->
  <circle cx="1250" cy="150" r="50" fill="#E8E0D0" opacity="0.9"/>
  <circle cx="1270" cy="140" r="45" fill="url(#nightsky)" opacity="0.8"/>
  <!-- Moon glow -->
  <circle cx="1250" cy="150" r="80" fill="#E8E0D0" opacity="0.08"/>
  <!-- Far hills -->
  <path d="M0 550 Q200 420 400 500 Q600 380 800 480 Q1000 400 1200 460 Q1400 390 1600 440 L1600 900 L0 900Z" fill="url(#darkhill2)" opacity="0.7"/>
  <!-- Near hills -->
  <path d="M0 620 Q300 500 500 580 Q700 480 900 560 Q1100 470 1300 540 Q1500 480 1600 520 L1600 900 L0 900Z" fill="url(#darkhill1)" opacity="0.9"/>
  <!-- Forest silhouette -->
  <g fill="#0A1F14" opacity="0.8">
    <path d="M0 700 L30 640 L60 700 L90 650 L120 700 L150 630 L180 700 L210 660 L240 700 L270 635 L300 700 L330 655 L360 700 L390 640 L420 700 L450 650 L480 700 L510 630 L540 700 L570 660 L600 700 L630 645 L660 700 L690 650 L720 700 L750 640 L780 700 L810 655 L840 700 L870 635 L900 700 L930 650 L960 700 L990 640 L1020 700 L1050 660 L1080 700 L1110 645 L1140 700 L1170 635 L1200 700 L1230 650 L1260 700 L1290 640 L1320 700 L1350 660 L1380 700 L1410 645 L1440 700 L1470 635 L1500 700 L1530 650 L1560 700 L1590 640 L1600 660 L1600 900 L0 900Z"/>
  </g>
  <!-- Ground -->
  <rect x="0" y="750" width="1600" height="150" fill="#081A10"/>
  <!-- Fireflies -->
  <g opacity="0.5">
    <circle cx="200" cy="680" r="3" fill="#AADD00"/>
    <circle cx="450" cy="660" r="2" fill="#AADD00"/>
    <circle cx="750" cy="690" r="3" fill="#AADD00"/>
    <circle cx="1050" cy="670" r="2" fill="#AADD00"/>
    <circle cx="1350" cy="685" r="3" fill="#AADD00"/>
  </g>
  <!-- Label -->
  <text x="800" y="840" text-anchor="middle" font-family="sans-serif" font-size="24" fill="rgba(255,255,255,0.15)">Placeholder: Dark Landscape</text>
</svg>
