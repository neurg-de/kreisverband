<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="60%" stop-color="#E0F0FF"/>
      <stop offset="100%" stop-color="#F5F0E8"/>
    </linearGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6BA368"/>
      <stop offset="100%" stop-color="#4A8B47"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5F9885"/>
      <stop offset="100%" stop-color="#3D7A5F"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- Sun -->
  <circle cx="1200" cy="200" r="80" fill="#FFD700" opacity="0.9"/>
  <circle cx="1200" cy="200" r="100" fill="#FFD700" opacity="0.2"/>
  <!-- Clouds -->
  <g opacity="0.7" fill="white">
    <ellipse cx="400" cy="180" rx="120" ry="40"/>
    <ellipse cx="340" cy="170" rx="80" ry="35"/>
    <ellipse cx="460" cy="175" rx="70" ry="30"/>
    <ellipse cx="900" cy="140" rx="90" ry="30"/>
    <ellipse cx="850" cy="132" rx="60" ry="25"/>
    <ellipse cx="950" cy="135" rx="55" ry="22"/>
  </g>
  <!-- Far hills -->
  <path d="M0 600 Q200 450 400 550 Q600 400 800 520 Q1000 430 1200 500 Q1400 420 1600 480 L1600 900 L0 900Z" fill="url(#hill2)" opacity="0.6"/>
  <!-- Near hills -->
  <path d="M0 650 Q300 520 500 600 Q700 500 900 580 Q1100 490 1300 560 Q1500 500 1600 540 L1600 900 L0 900Z" fill="url(#hill1)" opacity="0.8"/>
  <!-- Meadow -->
  <path d="M0 700 Q400 640 800 680 Q1200 650 1600 690 L1600 900 L0 900Z" fill="#5A9E50"/>
  <!-- Wildflowers -->
  <g opacity="0.6">
    <circle cx="150" cy="780" r="4" fill="#FFD700"/>
    <circle cx="300" cy="760" r="3" fill="#FF6B6B"/>
    <circle cx="500" cy="770" r="4" fill="#FFD700"/>
    <circle cx="650" cy="755" r="3" fill="#E88BD6"/>
    <circle cx="800" cy="765" r="4" fill="#FFD700"/>
    <circle cx="950" cy="750" r="3" fill="#FF6B6B"/>
    <circle cx="1100" cy="760" r="4" fill="#FFD700"/>
    <circle cx="1300" cy="748" r="3" fill="#E88BD6"/>
    <circle cx="1450" cy="758" r="4" fill="#FFD700"/>
  </g>
  <!-- Label -->
  <text x="800" y="840" text-anchor="middle" font-family="sans-serif" font-size="24" fill="rgba(0,0,0,0.2)">Placeholder: Bright Landscape</text>
</svg>
